<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    :root {
      --bg: #10131a; --surface: #1a1e28; --surface-2: #212635; --border: #2b3040;
      --text: #e8eaf0; --text-dim: #8b93a7; --teal: #4fd1c5; --amber: #e3a75a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f4; --border: #c8cedb;
        --text: #1b1f2a; --text-dim: #5a6272; --teal: #16847a; --amber: #b5711f;
      }
    }
    .title { fill: var(--text); font-size: 12.5px; font-weight: 600; }
    .cap { fill: var(--text-dim); font-size: 10px; }
    .legend { fill: var(--text-dim); font-size: 11px; }
  </style>

  <rect x="0" y="0" width="1500" height="300" fill="var(--bg)" />

  <!-- static wiring: main trace + branch to aspect -->
  <line x1="120" y1="170" x2="1470" y2="170" stroke="var(--border)" stroke-width="2" />
  <line x1="870" y1="90" x2="870" y2="142" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Aspect chip -->
  <rect id="aspect" x="775" y="40" width="190" height="50" rx="8" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="5 4">
    <animate attributeName="stroke" attributeType="XML" calcMode="discrete"
      keyTimes="0;0.240385;0.317308;0.740385;0.759615;1"
      values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
      dur="10.4s" repeatCount="indefinite" />
  </rect>
  <text x="870" y="60" text-anchor="middle" class="title">LoggingAspect</text>
  <text x="870" y="76" text-anchor="middle" class="cap">@Before / @Around / @After</text>

  <!-- Node boxes -->
  <!-- 0 Client -->
  <g>
    <rect x="60" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete" keyTimes="0;0.019231;1"
        values="#4fd1c5;#2b3040;#2b3040" dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="120" y="174" text-anchor="middle" class="title">Client</text>
    <text x="120" y="216" text-anchor="middle" class="cap">Postman</text>
  </g>

  <!-- 1 Security -->
  <g>
    <rect x="210" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.048077;0.067308;0.951923;0.971154;1"
        values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="270" y="170" text-anchor="middle" class="title">Security</text>
    <text x="270" y="184" text-anchor="middle" class="title">Filter</text>
    <text x="270" y="216" text-anchor="middle" class="cap">auth chain</text>
  </g>

  <!-- 2 DispatcherServlet -->
  <g>
    <rect x="360" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.096154;0.115385;0.903846;0.923077;1"
        values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="420" y="170" text-anchor="middle" class="title">Dispatcher</text>
    <text x="420" y="184" text-anchor="middle" class="title">Servlet</text>
    <text x="420" y="216" text-anchor="middle" class="cap">front controller</text>
  </g>

  <!-- 3 Interceptor -->
  <g>
    <rect x="510" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.144231;0.163462;0.855769;0.875;1"
        values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="570" y="170" text-anchor="middle" class="title">Logging</text>
    <text x="570" y="184" text-anchor="middle" class="title">Interceptor</text>
    <text x="570" y="216" text-anchor="middle" class="cap">preHandle()</text>
  </g>

  <!-- 4 Controller -->
  <g>
    <rect x="660" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.192308;0.211538;0.807692;0.826923;1"
        values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="720" y="174" text-anchor="middle" class="title">Controller</text>
    <text x="720" y="216" text-anchor="middle" class="cap">EmployeeController</text>
  </g>

  <!-- 5 Service -->
  <g>
    <rect x="810" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.240385;0.317308;0.740385;0.759615;1"
        values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="870" y="174" text-anchor="middle" class="title">Service</text>
    <text x="870" y="216" text-anchor="middle" class="cap">EmployeeService</text>
  </g>

  <!-- 6 Repository -->
  <g>
    <rect x="960" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.365385;0.384615;0.692308;0.711538;1"
        values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="1020" y="174" text-anchor="middle" class="title">Repository</text>
    <text x="1020" y="216" text-anchor="middle" class="cap">EmployeeRepository</text>
  </g>

  <!-- 7 EntityManager -->
  <g>
    <rect x="1110" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.413462;0.432692;0.644231;0.663462;1"
        values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="1170" y="170" text-anchor="middle" class="title">Entity</text>
    <text x="1170" y="184" text-anchor="middle" class="title">Manager</text>
    <text x="1170" y="216" text-anchor="middle" class="cap">persistence ctx</text>
  </g>

  <!-- 8 Hibernate -->
  <g>
    <rect x="1260" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.461538;0.480769;0.596154;0.615385;1"
        values="#2b3040;#4fd1c5;#2b3040;#e3a75a;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="1320" y="174" text-anchor="middle" class="title">Hibernate</text>
    <text x="1320" y="216" text-anchor="middle" class="cap">SQL generation</text>
  </g>

  <!-- 9 MySQL -->
  <g>
    <rect x="1410" y="142" width="120" height="56" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5">
      <animate attributeName="stroke" calcMode="discrete"
        keyTimes="0;0.509615;0.548077;1"
        values="#2b3040;#4fd1c5;#2b3040;#2b3040"
        dur="10.4s" repeatCount="indefinite" />
    </rect>
    <text x="1470" y="174" text-anchor="middle" class="title">MySQL</text>
    <text x="1470" y="216" text-anchor="middle" class="cap">database</text>
  </g>

  <!-- Travelling pulse -->
  <circle r="7" fill="var(--teal)">
    <animate attributeName="fill" calcMode="discrete"
      keyTimes="0;0.548077" values="#4fd1c5;#e3a75a"
      dur="10.4s" repeatCount="indefinite" />
    <animateMotion dur="10.4s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.240385;0.317308;0.509615;0.548077;0.740385;0.759615;1"
      keyPoints="0;0.277778;0.277778;0.5;0.5;0.722222;0.722222;1">
      <mpath href="#travel" />
    </animateMotion>
  </circle>
  <path id="travel" d="M120,170 L870,170 L1470,170 L870,170 L120,170" fill="none" stroke="none" />

  <!-- Legend -->
  <circle cx="640" cy="278" r="5" fill="var(--teal)" />
  <text x="654" y="282" class="legend">request</text>
  <circle cx="760" cy="278" r="5" fill="var(--amber)" />
  <text x="774" y="282" class="legend">response</text>
</svg>
