spring.application.name=spring-interview-lab
# Uncomment to experiment with field-injection circular references (not recommended)
# spring.main.allow-circular-references=true

spring.datasource.url=jdbc:mysql://localhost:3306/testdb
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# --- Spring Security (Section 5) ---
# HS256 secret — fixed on purpose so tokens survive an app restart (unlike a key generated at boot).
jwt.secret=interview-lab-super-secret-key-change-me-1234567890
jwt.expiration-ms=3600000

# --- Spring Cloud (Section 6) ---
# optional: lets the app boot fine even if no Config Server is running at this address.
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,refresh
